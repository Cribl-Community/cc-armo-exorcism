# Product API access declaration. Declare Cribl product API paths your app needs to access.
# At install time, admins see exactly which platform resources the app will use. These grants
# apply app-wide.
#
# The Church of Goat only reads configuration and status, queries metrics, runs pipeline
# previews (the engine processes inline events in a throwaway process; nothing is saved), and
# runs one Cribl Search query. It never creates, changes or deletes Cribl configuration.
# KV store access (/a/{appId}/kvstore/*) is granted automatically and is not declared here.

policies:
  # Environment census
  - object: '/system/info'
    actions: ['GET']
  - object: '/products/stream/groups'
    actions: ['GET']
  - object: '/products/stream/groups/*'
    actions: ['GET']
  - object: '/m/:gid/pipelines'
    actions: ['GET']
  - object: '/m/:gid/routes'
    actions: ['GET']
  - object: '/m/:gid/system/status/inputs'
    actions: ['GET']
  - object: '/m/:gid/system/status/outputs'
    actions: ['GET']

  # Metrics — read-only queries (the POST carries the query body)
  - object: '/system/metrics/query'
    actions: ['POST']

  # Pipeline preview — the exorcism. Inline events through an inline pipeline; not persisted.
  - object: '/m/:gid/preview'
    actions: ['POST']
  - object: '/preview'
    actions: ['POST']

  # Cribl Search (optional, Cribl.Cloud only) — the Heresy Scrolls
  - object: '/m/default_search/search/jobs'
    actions: ['POST']
  - object: '/m/default_search/search/jobs/*'
    actions: ['GET']
